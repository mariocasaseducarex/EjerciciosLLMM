<html>
 <head>
    <title>Ejercicio de Tabla</title>
    <style>
        table{
            border: 0px;
            margin: auto;
            border-spacing: 10px;
            width: 400px;
            height: 400px;
            background-color: #000000;

            }
            
    </style>
 </head>
 <body>
    <table>
      <tr>
        <td colspan="2" bgcolor="#ff0000"/>
        <td bgcolor="#ffffff"/>
        <td bgcolor="#0000ff"/>
      </tr>
      <tr>
        <td rowspan="2" bgcolor="#ffff00"/>
        <td bgcolor="#ffffff"/>
        <td colspan="2" rowspan="2" bgcolor="#ff0000"/>
      </tr>
      <tr>
        <td bgcolor="#0000ff"/>
      </tr>
      <tr>
        <td bgcolor="#ff0000"/>
        <td bgcolor="#ffffff"/>
        <td bgcolor="#ffff00"/>
        <td bgcolor="#0000ff"/>
      </tr>
    </table>
 </body>
</html>
