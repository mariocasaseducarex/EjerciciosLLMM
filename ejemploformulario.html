<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Formulario</title>
</head>

<body>

    <h1 style="text-align: center;">Formularios</h1>
    <table style="border:2px solid #050505; font-size: 20px; 
    margin-left:auto; margin-right: auto;">
        <form action="manejador.html" enctype="multipart/form-data" method="post" name="formtipos" id="formulario">
        </form>
        <tr>
            <td>
                <p>
                    <label for="nombre">Nombre: </label>
                    <input type="text" name="nombre" maxlength="20">
                </p>

                <p>
                    <label>
                    <input type="radio" name="etapa" id="menos20" value="joven" 
                    checked>Menos 20 años
                    </label>
                </p>
                <p>
                    <label>
                    <input type="radio" name="etapa" id="20-40" 
                    value="adulto">Entre 20 y 40 años
                    </label>
                </p>
                <p>
                    <label>
                    <input type="radio" name="etapa" id="41-60" 
                    value="maduro">Entre 41 y 60 años
                    </label>
                </p>
                <p>
                    <label>
                    <input type="radio" name="etapa" id="61-80" 
                    value="anciano">Entre 61 y 80 años
                    </label>
                </p>
                <p>
                    <label>
                    <input type="radio" name="etapa" id="mas80" 
                    value="achacoso">Más de 80 años
                    </label>
                </p>



            </td>
        </tr>



    </table>

</body>

</html>
