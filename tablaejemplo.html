<html>

<head>
  <title>Ejemplo de Tabla</title>
</head>

<body>
  <table border="3" bordercolor="#800000">
    <tr>
      <td colspan="2">A</td>
      <td>B</td>
      <td>C</td>
    </tr>
    <tr>
      <td rowspan="2">D</td>
      <td>E</td>
      <td colspan="2" rowspan="2" valign="middle">F</td>
    </tr>
    <tr>
      <td>G</td>
    </tr>
    <tr>
      <td>H</td>
      <td>I</td>
      <td>J</td>
      <td>K</td>
    </tr>
  </table>

</body>

</html>
