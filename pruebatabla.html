<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba tabla</title>
    <link rel="stylesheet" href="css/estilosprueba.css">
</head>

<body>
    <table>
        <caption id="titulotabla">Referencias aplicadas a don Quijote</caption>
        <colgroup>
            <col id="verde">
            <col id="azul">
            <col id="rojo">
        </colgroup>
        <thead>
            <tr>
                <th>Parte</th>
                <th>Nombre</th>
                <th>Comentario</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Primera</td>
                <td>Don Quijote de la Mancha</td>
                <td>Ideado por él mismo</td>
            </tr>
            <tr>
                <td>Segunda</td>
                <td>Caballero de los Leones</td>
                <td>Apelativo creado por don Quijote</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total referencias</th>
            </tr>
        </tfoot>
    </table>

</body>

</html>
